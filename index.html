<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Frontend Mentor | Typing Speed Test</title>
  </head>
  <body>
    <header class="typing-header">
      <img class="typing-header__logo" src="./assets/images/logo-small.svg" alt="webwite logo icon" />
      <div class="typing-header__score">
        <img src="./assets/images/icon-personal-best.svg" alt="score icon" />
        <p class="typing-header__score-text">Best: <span class="typing-header__score-count">92 WPM</span></p>
      </div>
    </header>
    <div class="typing-stats">
      <div class="typing-stats__item">
        <span class="typing-stats__label">WPM</span>
        <span class="typing-stats__value">0</span>
      </div>
      <div class="typing-stats__item">
        <span class="typing-stats__label">Accuracy</span>
        <span class="typing-stats__value">100%</span>
      </div>
      <div class="typing-stats__item">
        <span class="typing-stats__label">Time</span>
        <span class="typing-stats__value">0:60</span>
      </div>
    </div>
    <!-- <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. Coded by
      <a href="#">Your Name Here</a>.
    </footer> -->
  </body>
</html>
